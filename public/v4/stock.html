    <style>
      #priceTable > div > span {
        border: 1px solid black;
      }
      #priceDiff > div > span {
        border: 1px solid black;
      }
      #tenantUnits > div > span {
        border: 1px solid black;
      }

      }
      .dv-main-header {
        margin: 40px auto;
        text-align: center;
      }
      .dv-section-padding {
        padding: 50px 20px;
      }
      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        white-space: nowrap;
        text-align: center;
        background: #f8f8f8;
        z-index: 99;
        -webkit-transition: all linear 0.3s;
        transition: all linear 0.3s;
        background-color: white;
      }

      .preloader:before {
        content: '';
        display: inline-block;
        vertical-align: middle;
        height: 100%;
        margin-right: -0.25em;
      }

      .preloader.loaded {
        opacity: 0;
        visibility: hidden;
        z-index: -1;
      }

      .preloader .holder {
        display: inline-block;
        vertical-align: middle;
        white-space: normal;
      }

      .dv-bullet-margin {
        margin-bottom: 50px;
      }
      .dv-summary-dummy-hide {
        display: none;
      }
    </style>
  </head>

      function capitalGainLostCalc(capital, buyPrice, sellPrice){
        const stockQuantity = (capital/ buyPrice).toFixed(0);
        const gainLostAmount = (stockQuantity* sellPrice).toFixed(0);
        const profitLostAmount= (gainLostAmount- capital).toFixed(0);

        return{
          stockQuantity,
          gainLostAmount,
          capitalAmount:capital.toFixed(0),
          profitLostAmount
        }
      }

      function grandTotal(name, data){
        let totalAmount = 0;
        _.compact(data.map(res => res.name === name && res.amount)).map(amount => {
          totalAmount = totalAmount + amount
        })
        return totalAmount
      }


      function renderTables(){

                    <td>${res.action}</td>
                    <td>${res.remark}</td>
                </tr>
            `)
          );
        })

        db.stockingRecords.map(res=>{

            $(`

                    <td>${res.name}</td>

            `)

        })
