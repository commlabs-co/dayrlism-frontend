name: Secret scan

# Runs gitleaks over the FULL git history on every push and PR, so a secret
# can't slip into the repo (or its past) unnoticed once it's public.
#
# Uses the gitleaks binary directly rather than gitleaks-action, because the
# action requires a paid license key for organization-owned repos.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — leaks hide in old commits

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks

      - name: Scan full history
        run: ./gitleaks detect --source . --no-banner --redact --verbose
