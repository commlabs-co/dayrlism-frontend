server {
        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;
        server_name dayrlism.info www.dayrlism.info;
        location / {
                proxy_pass http://localhost:8080;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
        }

        listen [::]:443 ssl ipv6only=on; # managed by Certbot
        listen 443 ssl; # managed by Certbot
        ssl_certificate /etc/letsencrypt/live/dayrlism.info/fullchain.pem; # man    aged by Certbot
        ssl_certificate_key /etc/letsencrypt/live/dayrlism.info/privkey.pem; # m    anaged by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
 }

