<!DOCTYPE html>
<html lang="zxx">
  <head>
    <!-- Metas -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="author" content="Dayrl Lee" />
    <meta
      name="google-site-verification"
      content="JM_SGf8vbt6iUqEPskbPOjWNUkZP1N_7z8_FvvunlM8"
    />
    <!-- Title  -->
    <title>Incremental Calculator</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/uikit/3.0.3/css/uikit.min.css"
    />
    <style>
      #priceTable > div > span {
        border: 1px solid black;
      }
      #priceDiff > div > span {
        border: 1px solid black;
      }
      #tenantUnits > div > span {
        border: 1px solid black;
      }
      #priceOweTable > div > span {
        border: 1px solid black;
      }
      .o2-main-header {
        margin: 40px auto;
        text-align: center;
      }
      .o2-section-padding {
        padding: 50px 20px;
      }
      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        white-space: nowrap;
        text-align: center;
        background: #f8f8f8;
        z-index: 99;
        -webkit-transition: all linear 0.3s;
        transition: all linear 0.3s;
        background-color: white;
      }

      .preloader:before {
        content: '';
        display: inline-block;
        vertical-align: middle;
        height: 100%;
        margin-right: -0.25em;
      }

      .preloader.loaded {
        opacity: 0;
        visibility: hidden;
        z-index: -1;
      }

      .preloader .holder {
        display: inline-block;
        vertical-align: middle;
        white-space: normal;
      }

      .o2-bullet-margin {
        margin-bottom: 50px;
      }
      .o2-summary-dummy-hide {
        display: none;
      }
    </style>
  </head>

  <body>
    <!--Preload-->
    <div class="preloader" id="pageLoad">
      <span uk-spinner="ratio: 4.5"></span>
    </div>

    <h1 class="uk-heading-line uk-text-center o2-main-header">
      <span>Incremental Calculator</span>
    </h1>
    <div class="uk-section">
      <div class="uk-container o2-section-padding">
        <form>
          <fieldset class="uk-fieldset">
            <h1 class="uk-heading-bullet o2-bullet-margin">Price Percentages</h1>

            <div class="uk-margin">
              <input
                id="price-from"
                class="uk-input"
                type="text"
                placeholder="Price From"
                required
              />
            </div>
            <div class="uk-margin">
              <input
                id="price-to"
                class="uk-input"
                type="text"
                placeholder="Price To"
                required
              />
            </div>
            <div class="uk-margin">
              <input
                id="stock-quantity"
                class="uk-input"
                type="text"
                placeholder="Stock Quantity"
              />
            </div>
            
          </fieldset>
          <button id="o2-submit-calculator" class="uk-button uk-button-primary">
            Submit
          </button>
        </form>
        <h1 class="uk-heading-divider">Summary</h1>
        <div id="o2-summary-dummy-hide" class="uk-placeholder uk-text-center">
          Submit to show summaries
        </div>
        <div id="o2-summary-board"></div>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uikit/3.0.3/js/uikit.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uikit/3.0.3/js/uikit-icons.min.js"></script>
    <script>
      var $win = $(window);
      $win.on('load', function() {
        $('#pageLoad').remove();
      });


      $('#o2-submit-calculator').on('click', function () {
          $('#o2-summary-dummy-hide').addClass('o2-summary-dummy-hide');
          var priceFrom = Number($('#price-from').val());
          var priceTo = Number($('#price-to').val());
          var stockQuantity = Number($('#stock-quantity').val());

          const numberIncrease= priceTo-priceFrom;

          const percent= ((numberIncrease)/ priceFrom)*100;


            const capitalInvested= stockQuantity* priceFrom;
            const grossProfitLost= stockQuantity * priceTo;
            const netProfitLost= (stockQuantity * priceTo)- capitalInvested;

         

          $('#o2-summary-board').append(
            $(`
                <div class="uk-grid-small" uk-grid>
                        <div class="uk-width-expand" uk-leader="fill: -">Number Increase</div>
                        <div>${numberIncrease.toFixed(2)}</div>
                </div>
                <div class="uk-grid-small" uk-grid>
                        <div class="uk-width-expand" uk-leader="fill: -">Price From ${priceFrom} to ${priceTo} is</div>
                        <div>${percent.toFixed(2)}%</div>
                </div>
                <div class="uk-grid-small" uk-grid>
                        <div class="uk-width-expand" uk-leader="fill: -">Capital</div>
                        <div>${stockQuantity?`${capitalInvested.toFixed(2)}`:'N/A'}</div>
                </div>
                <div class="uk-grid-small" uk-grid>
                        <div class="uk-width-expand" uk-leader="fill: -">Gross Profit/Lost</div>
                        <div>${stockQuantity ? `${grossProfitLost.toFixed(2)}` : 'N/A'}</div>
                </div>
                <div class="uk-grid-small" uk-grid>
                        <div class="uk-width-expand" uk-leader="fill: -">Net Profit/Lost</div>
                        <div>${stockQuantity?`${netProfitLost.toFixed(2)}`:'N/A'}</div>
                </div>
                <hr class="uk-divider-icon" />
            `)
          );
        
          return false;
        });

      
    </script>
  </body>
</html>
